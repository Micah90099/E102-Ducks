<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ducks - E102 Challenge </title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        button:active,
        input:focus {
            outline: none;
        }

        button:hover {
            cursor: pointer
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            display: grid;
            place-content: center;
        }

        svg {
            height: 1000px;
        }

        #ducks {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .space {
            width: 50px;
            height: 50px;
            border-bottom: 3px solid black;
            position: relative;
        }

        img {
            position: absolute;
            height: 50px;
            aspect-ratio: 1;
            transition-property: left;
            transition-duration: calc(.5s / var(--speed));
            transition-timing-function: ease-in;
            transition-delay: 0;
            left: 0;
        }

        .left {
            transform: rotateY(180deg)
        }

        .moving {
            left: var(--left);
        }

        #inputs {
            position: fixed;
            bottom: 0;
            left: calc(50% - 10px);
            height: 150px;
            width: 20px;
            display: grid;
            place-content: center;
        }

        input {
            width: 200px;
        }

        /* 
        img::before {
            content: "e";
            color: black;
            position: absolute;
            width: 10px;;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 5px;
            top: 0;
            left: 0;
            font-size: 30px;
            z-index: 100;
        } */

        .highlight {
            filter: drop-shadow(0 0 10px #FEEC49);
        }
    </style>
</head>

    <div id="ducks" style="--speed:1"></div>
    <div id="inputs">
        <input id="amount" min="1" step="1" type="number" placeholder="Amount of ducks on each side">
        <button id="submit">Submit</button>
        <button id="solve">Start Solving</button>
        <label for="speed">Speed:</label>
        <div style="display: flex;
        align-items: center;
        justify-content: center; gap: 10px">
            <input type="range" min=".25" max="5" value="1" step=".25" name="speed" id="speed">
            <p id="speed-display">1.00x</p>
        </div>
    </div>

    <script>
        let amount = 11;
        let speed = 1;
        let started = false;

        function setup() {
            started = false;
            ducks.innerHTML = "";

            $(".highlight")?.classList.remove("highlight");

            for (let i = 0; i < amount; i++) {
                ducks.innerHTML += `
                <div class="space" space="${i + 1}">
                    ${i + 1 == Math.ceil(amount / 2) ? "" : `<img style="--left: 0;" src="./duck.png" alt="Duck ${i < amount / 2 ? "Right" : "Left"}" class="${i < amount / 2 ? "right" : "left"}" id="${i < amount / 2 ? "r" : "l"}${(i + 1) % Math.ceil(amount / 2)}">`}
                </div>
                `;
            }
        }

        setup();

        function move(duck, space) {
            if (!space) {
                space = $(`[space="${duck.parentElement.getAttribute("space") * 1 + (duck.id.startsWith("r") ? 1 : -1)}"`);
            }

            return new Promise((resolve) => {
                setTimeout(() => {
                    duck.style = `--left: ${60 * (space.getAttribute("space") - duck.parentElement.getAttribute("space"))}px`;
                    duck.classList.add("moving");

                    setTimeout(() => {
                        space.appendChild(duck)
                        duck.style = "--left: 0";
                        duck.classList.remove("moving");
                        setTimeout(() => { resolve(); });
                    }, 500 / speed);
                });
            });
        }

        function jump(duckToJump) {
            if (duckToJump.id.startsWith("r")) {
                return move(duckToJump, $(`[space="${duckToJump.parentElement.getAttribute("space") * 1 + 2}"]`));
            }
            return move(duckToJump, $(`[space="${duckToJump.parentElement.getAttribute("space") - 2}"]`));
        }

        function canMove(duck) {
            const space = duck.parentElement.getAttribute("space") * 1 + (duck.id.startsWith("r") ? 1 : -1);
            if (space < 1 || space > amount) return false;

            return !$(`[space="${space}"]`).querySelector("img");
        }

        function $(query) {
            return document.querySelector(query);
        }

        function $$(query) {
            return Array.from(document.querySelectorAll(query));
        }

        //Can you jump over a duck of the opposite direction
        function canJump(duck) {
            const space = duck.parentElement.getAttribute("space") * 1 + (duck.id.startsWith("r") ? 2 : -2);
            if (space < 1 || space > amount) return false;

            return !$(`[space="${space}"]`).querySelector("img") && $(`[space="${space + (duck.id.startsWith("r") ? -1 : 1)}"]`).querySelector("img")?.id[0] != duck.id[0];
        }

        (async () => {
            const RM = "rmq";
            const LJ = "ljq";
            const LM = "lmq";
            const RJ = "rjq";
            const WS = "wq";
            const START = "start";
            const END = "end"

            function highlightPath(state) {
                $(".highlight")?.classList.remove("highlight");
                $("#" + state).classList.add("highlight");
            }

            async function solve() {
                started = true;
                let state = START;
                let a = 0;
                while (started && state != END && a < 10 ** 5) {
                    highlightPath(state);
                    switch (state) {
                        case START:
                            state = RM;
                            break;
                        case RM:
                            for (let duck of $$(".right").reverse()) {
                                if (canMove(duck)) {
                                    await move(duck);
                                    break;
                                }
                            }
                            if (state == RM) {
                                state = WS;
                                break;
                            }

                            state = LJ;
                            break;
                        case WS:
                            let endStateCheck = "l";
                            for (let space in $$(".space")) {
                                const img = $$(".space")[space].querySelector("img");

                                if (!img) {
                                    if (endStateCheck == "l") {
                                        endStateCheck = "s";
                                    } else {
                                        state = LJ;
                                        break;
                                    }
                                } else if (img.id.startsWith("l") && endStateCheck != "l") {
                                    state = LJ;
                                    break;
                                } else if (img.id.startsWith("r") && endStateCheck == "l") {
                                    state = LJ;
                                    break;
                                }
                            }

                            if (state == LJ) break;

                            state = END;
                            break;
                        case LJ:
                            let hasLeftJumped = false;
                            for (let duck of $$(".left")) {
                                if (canJump(duck)) {
                                    await jump(duck);
                                    hasLeftJumped = true;
                                    break;
                                }
                            }

                            if (hasLeftJumped) break;

                            state = LM;
                            break;
                        case LM:
                            for (let duck of $$(".left")) {
                                if (canMove(duck)) {
                                    await move(duck);
                                    break;
                                }
                            }

                            state = RJ;
                            break;
                        case RJ:
                            let hasRightJumped;
                            for (let duck of $$(".right").reverse()) {
                                if (canJump(duck)) {
                                    await jump(duck);
                                    hasRightJumped = true;
                                    break;
                                }
                            }

                            if (hasRightJumped) break;

                            state = RM;
                            break;
                    }

                    console.log(state);
                    a++;
                }
            }

            $("#solve").addEventListener("click", solve);


            // await move($("#l1"));
            // await jump($("#r2"));
            // await move($("#r1"));
            // await jump($("#l1"));
            // await jump($("#l2"));
            // await move($("#r2"));
            // await jump($("#r1"));
            // await move($("#l2"));

            // await move($("#l1"));
            // await jump($("#r3"));
            // await move($("#r2"));
            // await jump($("#l1"));
            // await jump($("#l2"));
            // await move($("#l3"));
            // await jump($("#r3"));
            // await jump($("#r2"));
            // await jump($("#r1"));
            // await move($("#l1"));
            // await jump($("#l2"));
            // await jump($("#l3"));
            // await move($("#r2"));
            // await jump($("#r1"));
            // await move($("#l3"));
        })();

        $("#speed").addEventListener("input", e => {
            $("#speed-display").innerHTML = (e.target.value * 1).toFixed(2) + "x"
            $("#ducks").style = "--speed:" + e.target.value * 1;
            speed = e.target.value * 1;
        })

        $("#submit").addEventListener("click", e => {
            const value = parseInt($("#amount").value);

            if (isNaN(value) || value < 0 || ~~(value) != value) return;

            amount = 2 * value + 1;

            setup();
        })
    </script>
